[project]
name = "mhtran-rasters"
version = "0.1.0"
description = "Hazard raster preprocessing pipeline for mhtran-dash"
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "typer>=0.12",
    "pytest>=8.0",
    "geopandas>=0.14",
    "scipy>=1.12",
    "h5py>=3.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rasters", "colormaps"]
